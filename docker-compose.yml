name: tinypilot-dashboard

services:
  dashboard:
    build: .
    ports:
      # Bind to localhost only. To expose the dashboard to other hosts on a
      # trusted network, see "Deployment & security" in the README.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      # Optional: enable AI assistant (BYOK). Requires TinyPilot Pro + Automation API on devices.
      # - ASSISTANT_API_KEY=sk-...
      # - ASSISTANT_MODEL=gpt-4o
      # - ASSISTANT_BASE_URL=https://api.openai.com/v1
    restart: unless-stopped
