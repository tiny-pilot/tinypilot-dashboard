version: 2.1

# CircleCI for TinyPilot Dashboard. Jobs mirror Cloud/Pro gates that apply
# to this Flask app (tests, lint, ShellCheck, JS syntax, SAST, pip-audit).
# Appliance-only jobs (Debian/Packer/HCL/device e2e) are omitted.

executors:
  ubuntu:
    docker:
      - image: cimg/base:2024.02
  python:
    docker:
      - image: cimg/python:3.12
  node:
    docker:
      - image: cimg/node:24.13.1

jobs:
  check_whitespace:
    executor: ubuntu
    steps:
      - checkout
      - run:
          name: Check for trailing whitespace
          command: ./dev-scripts/check-trailing-whitespace
      - run:
          name: Check that all text files end in a trailing newline
          command: ./dev-scripts/check-trailing-newline

  check_bash:
    executor: ubuntu
    steps:
      - checkout
      - run:
          name: Install ShellCheck
          command: |
            set -eux
            readonly SHELLCHECK_VERSION='v0.9.0'
            wget --quiet --output-document - \
              "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" |
              tar --extract --xz --verbose
            sudo cp "./shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/bin
            shellcheck --version
      - run:
          name: Run ShellCheck
          command: ./dev-scripts/check-bash

  check_python:
    executor: python
    steps:
      - checkout
      - run:
          name: Install Python requirements
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install \
              --requirement requirements.txt \
              --requirement requirements_dev.txt
      - run:
          name: Run check script
          command: |
            . venv/bin/activate
            ./dev-scripts/check-python

  check_javascript:
    executor: node
    steps:
      - checkout
      - run:
          name: Syntax-check JavaScript
          command: ./dev-scripts/check-javascript

  check_security:
    executor: python
    steps:
      - checkout
      - run:
          name: Create virtual environment
          command: python3 -m venv venv
      - run:
          name: Install requirements
          command: |
            . venv/bin/activate
            pip install --upgrade pip
            pip install \
              --requirement requirements.txt \
              --requirement requirements_dev.txt
            pip install 'semgrep==1.163.0' 'pip-audit>=2.7,<3.0'
      - run:
          name: Run Static Application Security Testing (SAST)
          command: |
            . venv/bin/activate
            ./dev-scripts/check-security

workflows:
  test:
    jobs:
      - check_whitespace
      - check_bash
      - check_python
      - check_javascript
      - check_security
